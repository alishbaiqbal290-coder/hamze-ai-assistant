

<!-- Hamza AI Voice Assistant Controls -->
<section class="voice-controls">
  <h2>Hamza AI Assistant</h2>
  <p id="voiceStatus">السلام علیکم حمزہ صاحب!</p>

  <button id="voiceButton" onclick="startListening()">
    🎙️ بات کریں
  </button>

  <button onclick="stopListening()">
    ⏹️ وائس بند کریں
  </button>

  <div id="assistantReply">
    میں آپ کا حکم سننے کے لیے تیار ہوں۔
  </div>
</section>

<script>
let recognition;
let listening = false;

function speakUrdu(message) {
  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "ur-PK";
  speech.rate = 0.9;
  speechSynthesis.speak(speech);
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("آپ کے براؤزر میں وائس سپورٹ دستیاب نہیں ہے۔");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "ur-PK";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const command =
      event.results[event.results.length - 1][0].transcript;

    handleCommand(command.toLowerCase());
  };

  recognition.onerror = function() {
    document.getElementById("voiceStatus").innerText =
      "وائس میں مسئلہ آیا، دوبارہ کوشش کریں۔";
  };

  recognition.start();
  listening = true;

  document.getElementById("voiceStatus").innerText =
    "حمزہ صاحب، میں سن رہا ہوں۔";
}

function stopListening() {
  if (recognition && listening) {
    recognition.stop();
  }

  listening = false;
  document.getElementById("voiceStatus").innerText =
    "وائس بند ہے۔";
}

function handleCommand(command) {
  if (command.includes("youtube")) {
    speakUrdu("حمزہ صاحب، یوٹیوب کھول رہا ہوں۔");
    if (window.AndroidAssistant) {
      window.AndroidAssistant.openApp("youtube");
    }
  }

  else if (command.includes("whatsapp")) {
    speakUrdu("حمزہ صاحب، واٹس ایپ کھول رہا ہوں۔");
    if (window.AndroidAssistant) {
      window.AndroidAssistant.openApp("whatsapp");
    }
  }

  else if (command.includes("torch") ||
           command.includes("ٹارچ")) {
    speakUrdu("حمزہ صاحب، ٹارچ کے لیے درخواست بھیج رہا ہوں۔");
    if (window.AndroidAssistant) {
      window.AndroidAssistant.toggleTorch();
    }
  }

  else if (command.includes("brightness") ||
           command.includes("برائٹنس")) {
    speakUrdu("حمزہ صاحب، برائٹنس سیٹنگ کھول رہا ہوں۔");
    if (window.AndroidAssistant) {
      window.AndroidAssistant.openBrightnessSettings();
    }
  }

  else {
    speakUrdu("حمزہ صاحب، یہ حکم ابھی میرے پاس دستیاب نہیں ہے۔");
  }
}
</script>
