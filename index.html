<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA AI SYSTEM</title>
<style>
body{background:#050a14;color:white;font-family:Arial;text-align:center;margin:0;padding:20px}
h1{color:#00aaff;text-shadow:0 0 15px #00aaff}
#mic{width:120px;height:120px;background:radial-gradient(#00aaff,#004466);border-radius:50%;border:none;box-shadow:0 0 30px #00aaff;font-size:50px;margin:20px}
#mic.listening{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 20px #00aaff}50%{box-shadow:0 0 50px #00aaff}100%{box-shadow:0 0 20px #00aaff}}
.box{background:#0f1a2e;border:1px solid #00aaff;border-radius:15px;padding:15px;margin:15px 0;min-height:50px;text-align:right}
.btn{background:#0f1a2e;border:1px solid #00aaff;color:#00aaff;padding:10px 15px;border-radius:20px;margin:5px}
#status{color:#00ff88}
</style>
</head>
<body>
<h1>HAMZA AI SYSTEM</h1>
<p id="status">سسٹم تیار ہے...</p>

<button id="mic">🎙️</button>
<p>بولو حمزہ بھائی</p>

<div class="box">
<b>آپ نے کہا:</b>
<div id="userText">...</div>
</div>

<div class="box">
<b>حمزہ AI کا جواب:</b>
<div id="aiText">السلام علیکم حمزہ بھائی، میں تیار ہوں۔ بولو کیا کرنا ہے؟</div>
</div>

<div>
<button class="btn" onclick="doCommand('واٹس ایپ کھولو')">واٹس ایپ</button>
<button class="btn" onclick="doCommand('یوٹیوب کھولو')">یوٹیوب</button>
<button class="btn" onclick="doCommand('کال کرو')">کال</button>
<button class="btn" onclick="doCommand('وقت بتاؤ')">وقت</button>
</div>

<script>
const mic = document.getElementById('mic');
const userText = document.getElementById('userText');
const aiText = document.getElementById('aiText');
const status = document.getElementById('status');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

function speak(text){
  aiText.innerText = text;
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'ur-PK';
  msg.rate = 0.9;
  window.speechSynthesis.speak(msg);
}

function doCommand(text){
  text = text.toLowerCase();
  userText.innerText = text;

  if(text.includes('واٹس ایپ') || text.includes('whatsapp')){
    speak('جی بھائی واٹس ایپ کھول رہا ہوں');
    window.open('https://wa.me/', '_blank');
  }
  else if(text.includes('یوٹیوب') || text.includes('youtube')){
    speak('یوٹیوب کھول رہا ہوں');
    window.open('https://m.youtube.com', '_blank');
  }
  else if(text.includes('گوگل') || text.includes('google')){
    speak('گوگل کھول رہا ہوں');
    window.open('https://google.com', '_blank');
  }
  else if(text.includes('کال') || text.includes('call')){
    speak('کال ڈائلر کھول رہا ہوں');
    window.location.href = 'tel:';
  }
  else if(text.includes('وقت') || text.includes('time')){
    let t = new Date().toLocaleTimeString('ur-PK');
    speak('اس وقت وقت ہے ' + t);
  }
  else if(text.includes('تاریخ') || text.includes('date')){
    let d = new Date().toLocaleDateString('ur-PK');
    speak('آج کی تاریخ ہے ' + d);
  }
  else if(text.includes('نام کیا') || text.includes('کون ہو')){
    speak('میں حمزہ AI سسٹم ہوں، حمزہ بھائی کا پرسنل اسسٹنٹ');
  }
  else if(text.includes('السلام')){
    speak('وعلیکم السلام حمزہ بھائی، سنائیں کیا حکم ہے؟');
  }
  else{
    speak('آپ نے کہا ' + text + '، میں اس پر کام کر رہا ہوں۔ اگر آپ نے ایپ کھولنے کا کہا ہے تو بتائیں کونسی ایپ کھولنی ہے؟');
  }
}

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'ur-PK';
  recognition.continuous = false;

  recognition.onstart = ()=>{
    mic.classList.add('listening');
    status.innerText = 'سن رہا ہوں...';
  }
  recognition.onend = ()=>{
    mic.classList.remove('listening');
    status.innerText = 'سسٹم تیار ہے...';
  }
  recognition.onresult = (e)=>{
    let text = e.results[0][0].transcript;
    doCommand(text);
  }

  mic.onclick = ()=> recognition.start();
}else{
  status.innerText = 'آپ کے براؤزر میں وائس سپورٹ نہیں، کروم استعمال کریں';
  mic.onclick = ()=>{
    let t = prompt('بول کر لکھیں، کیا کرنا ہے؟');
    if(t) doCommand(t);
  }
}
speak('السلام علیکم حمزہ بھائی، حمزہ AI سسٹم آن لائن ہے');
</script>
</body>
</html>
