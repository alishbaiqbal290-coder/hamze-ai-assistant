<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA AI</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center}
.top{background:#000;padding:20px;text-align:right;border-bottom:1px solid #222}
.top h1{margin:0;font-size:32px}
.top p{margin:5px 0 0;color:#888;font-size:18px}
.logo{width:110px;height:110px;background:#222;border-radius:50%;margin:35px auto 10px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold;border:1px solid #555}
h2{font-size:32px;margin:10px 0 5px}
.sub{color:#888;font-size:20px;padding:0 20px}
.box{background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:20px;margin:25px 15px;text-align:right;font-size:20px;line-height:1.6;min-height:100px}
input{width:88%;padding:16px;border-radius:15px;border:1px solid #333;background:#111;color:#fff;font-size:18px;outline:none;text-align:center}
.send{background:#fff;color:#000;border:none;padding:16px;border-radius:15px;width:92%;font-size:20px;font-weight:bold;margin-top:12px}
.mic{width:70px;height:70px;border-radius:50%;background:#fff;font-size:30px;border:none;margin-top:18px}
.mic.listening{background:#00ff88;transform:scale(1.1)}
#status{color:#00ff88;font-size:13px;margin-top:8px}
.unlock{background:#00aaff;color:#fff;border:none;padding:10px 18px;border-radius:20px;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="top"><h1>HAMZA AI</h1><p>Your Personal AI Assistant</p></div>

<div class="logo">H</div>
<h2>Hamza AI Assistant</h2>
<div class="sub">Your Voice. Your Commands. Your Assistant.</div>
<div id="status">سسٹم تیار ہے...</div>
<button class="unlock" onclick="unlockAudio()">🔊 آواز آن کرنے کے لیے یہاں دبائیں</button>

<div class="box">
<div id="userText">You: ...</div>
<div id="aiText" style="margin-top:10px;color:#ccc">میں تیار ہوں حمزہ بھائی، حکم کریں</div>
</div>

<input id="txt" placeholder="Type your command here...">
<br>
<button class="send" onclick="fromInput()">SEND COMMAND</button>
<br>
<button class="mic" id="micBtn">🎙️</button>
<p style="color:#888;font-size:13px">مائیک دبائیں اور اردو میں بولیں</p>

<script>
let userText=document.getElementById('userText');
let aiText=document.getElementById('aiText');
let status=document.getElementById('status');
let femaleVoice=null;
let audioUnlocked=false;

function loadVoices(){
  let vs=window.speechSynthesis.getVoices();
  femaleVoice = vs.find(v=>v.lang.includes('ur') && v.name.toLowerCase().includes('female')) ||
                vs.find(v=>v.lang.includes('ur')) ||
                vs.find(v=>v.name.toLowerCase().includes('samantha')||v.name.toLowerCase().includes('zira')||v.name.toLowerCase().includes('aria')) ||
                vs.find(v=>v.name.toLowerCase().includes('female'));
}
window.speechSynthesis.onvoiceschanged=loadVoices; loadVoices();

// --- 1. AWAZ UNLOCK - YE SAB SE ZAROORI HAI ---
function unlockAudio(){
  audioUnlocked=true;
  loadVoices();
  // Choti si khamosh awaz se browser ko unlock karo
  let m=new SpeechSynthesisUtterance("Assalam o Alaikum Hamza bhai, awaz on ho gai hai");
  m.lang='ur-PK'; m.pitch=1.3; m.rate=0.92; if(femaleVoice) m.voice=femaleVoice;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(m);
  status.innerText="✅ آواز آن ہو گئی - اب بولو";
  aiText.innerText="آواز آن ہو گئی ہے حمزہ بھائی، اب حکم کریں";
}

function speak(t){
  aiText.innerText=t;
  if(!audioUnlocked){
    // Agar unlock nahi hua to bhi koshish karo
    audioUnlocked=true;
  }
  try{
    window.speechSynthesis.cancel();
    let m=new SpeechSynthesisUtterance(t);
    m.lang='ur-PK'; m.rate=0.92; m.pitch=1.3;
    if(femaleVoice) m.voice=femaleVoice;
    window.speechSynthesis.speak(m);
  }catch(e){ console.log(e); }
}

function fromInput(){
  let v=document.getElementById('txt').value;
  if(!v.trim()){ speak("پہلے کچھ لکھیں تو سہی حمزہ بھائی"); return; }
  let cmd=v; // Pehle save karo, phir clear karo - Yahi bug tha
  document.getElementById('txt').value="";
  doCommand(cmd);
}

// --- 2. APPS CONTROL - INTENT WALA TAREEQA ---
function openApp(intentUrl, webUrl){
  // Pehle Android App kholne ki koshish, na khule to website
  try{ window.location.href=intentUrl; }catch(e){}
  setTimeout(()=>{ window.open(webUrl,'_blank'); },1200);
}

function doCommand(raw){
  let text=raw.toLowerCase().trim();
  userText.innerText="You: "+raw;
  status.innerText="Command mila: "+raw;

  if(text.includes('whatsapp')||text.includes('واٹس')){
    speak("جی حمزہ بھائی، واٹس ایپ کھول رہی ہوں");
    openApp('intent://send#Intent;scheme=whatsapp;package=com.whatsapp;end','https://wa.me/');
  }
  else if(text.includes('youtube')||text.includes('یوٹیوب')){
    speak("جی، یوٹیوب کھول رہی ہوں");
    openApp('intent://www.youtube.com#Intent;scheme=https;package=com.google.android.youtube;end','https://m.youtube.com');
  }
  else if(text.includes('facebook')||text.includes('فیس')){
    speak("فیس بک کھول رہی ہوں");
    openApp('intent://facebook.com#Intent;scheme=https;package=com.facebook.katana;end','https://m.facebook.com');
  }
  else if(text.includes('tiktok')||text.includes('ٹک')){
    speak("ٹک ٹاک کھول رہی ہوں");
    openApp('intent://#Intent;scheme=snssdk1128;package=com.zhiliaoapp.musically;end','https://www.tiktok.com');
  }
  else if(text.includes('camera')||text.includes('کیمرہ')){
    speak("کیمرہ کھول رہی ہوں");
    openApp('intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end','https://google.com');
  }
  else if(text.includes('gallery')||text.includes('گیلری')||text.includes('photo')){
    speak("گیلری کھول رہی ہوں");
    openApp('intent://#Intent;action=android.intent.action.VIEW;type=image/*;end','https://google.com');
  }
  else if(text.includes('setting')||text.includes('سیٹنگ')){
    speak("سیٹنگ کھول رہی ہوں");
    openApp('intent://#Intent;action=android.settings.SETTINGS;end','https://google.com');
  }
  else if(text.includes('call')||text.includes('کال')||text.includes('sister')||text.includes('bhai')||text.includes('amma')||text.includes('abu')){
    // Sister ko call lgo - Number nikalna
    let name=raw.replace(/call|karo|ko|lgo|lagao/gi,"").trim();
    speak("جی حمزہ بھائی، "+name+" کو کال لگا رہی ہوں، ڈائلر کھول رہی ہوں");
    setTimeout(()=>{ window.location.href="tel:"; },800);
  }
  else if(text.includes('google')||text.includes('گوگل')){
    speak("گوگل کھول رہی ہوں");
    window.open('https://google.com','_blank');
  }
  else if(text.includes('waqt')||text.includes('وقت')||text.includes('time')||text.includes('baj')){
    speak("حمزہ بھائی، اس وقت وقت ہے "+new Date().toLocaleTimeString('ur-PK'));
  }
  else if(text.includes('research')||text.includes('ریسرچ')||text.includes('کے بارے')||text.includes('کیا ہے')||text.includes('matlab')){
    let q=raw.replace(/research|ریسرچ|کے بارے میں|بتاؤ|batao|کیا ہے/gi,"").trim();
    speak("حمزہ بھائی، "+q+" کے بارے میں ریسرچ کر رہی ہوں");
    setTimeout(()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank'),800);
  }
  else if(text.includes('salam')||text.includes('سلام')||text.includes('hi')||text.includes('hello')||text.includes('hy')){
    speak("وعلیکم السلام حمزہ بھائی، میں آپ کی حمزہ اے آئی ہوں، سنائیں کیا حکم ہے؟");
  }
  else if(text.includes('kesi ho')||text.includes('کیسی')){
    speak("میں بالکل ٹھیک ہوں حمزہ بھائی، آپ سنائیں");
  }
  else{
    speak("آپ نے کہا "+raw+"، میں اس کے بارے میں ریسرچ کر رہی ہوں");
    setTimeout(()=>window.open('https://www.google.com/search?q='+encodeURIComponent(raw),'_blank'),800);
  }
}

// --- 3. MIC FIX ---
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  let rec=new SR(); rec.lang='ur-PK'; rec.continuous=false;
  rec.onstart=()=>{ document.getElementById('micBtn').classList.add('listening'); status.innerText="سن رہی ہوں... بولیے"; };
  rec.onend=()=>{ document.getElementById('micBtn').classList.remove('listening'); };
  rec.onerror=(e)=>{ status.innerText="Mic Error: "+e.error+" - Chrome me kholo aur Allow dabao"; speak("مائیک کی اجازت نہیں ملی، کروم میں کھول کر Allow دبائیں"); };
  rec.onresult=(e)=>{ doCommand(e.results[0][0].transcript); };
  document.getElementById('micBtn').onclick=()=>{
    if(!audioUnlocked) unlockAudio();
    try{ rec.start(); }catch(e){ rec.stop(); setTimeout(()=>rec.start(),300); }
  };
}else{
  document.getElementById('micBtn').onclick=()=>speak("اس ایپ میں مائیک نہیں چلے گا، کروم میں کھولیں");
}
</script>
</body>
</html>
