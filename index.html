<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamze AI Assistant</title>
<style>
body{background:#0a1f14;color:white;font-family:Arial;margin:0;padding:0}
#chat{height:65vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:15px;max-width:80%;line-height:1.5}
.user{background:#1a7a4a;align-self:flex-end}
.ai{background:#1e2e26;align-self:flex-start}
#box{display:flex;gap:8px;padding:10px}
input{flex:1;padding:13px;border-radius:12px;border:none;background:#16281e;color:white;outline:none}
button{background:#00e676;color:black;border:none;padding:12px 16px;border-radius:12px;font-weight:bold;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:15px}
.controls button{background:#123322;color:white}
</style>
</head>
<body>
<div id="chat"></div>
<div id="box">
<input id="input" placeholder="Type your message here...">
<button onclick="sendMsg()">SEND</button>
</div>
<div class="controls">
<button onclick="startCall()">📞 CALL ON</button>
<button onclick="stopCall()">🚫 CALL OFF</button>
<button onclick="toggleVoice()">🔊 Voice ON/OFF</button>
<button onclick="clearChat()">🗑️ Clear Chat</button>
</div>

<script>
let voiceOn = true;
let callMode = false;
let recognition = null;
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function addMsg(text, who){
  let d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(who==='ai' && voiceOn) speak(text);
}

function getReply(t){
  t = t.toLowerCase();
  if(t.includes('assalam') || t.includes('salam') || t.includes('hello') || t.includes('hi') || t.includes('hey')) return "Walaikum Assalam! Kaisay hain aap? Main Hamze AI hoon, aap se baat karke bohat khushi hui.";
  if(t.includes('kaun') || t.includes('naam') || t.includes('tumhara')) return "Mera naam Hamze AI Assistant hai. Main aapki dost hoon, aap mujhse kuch bhi pooch sakte hain.";
  if(t.includes('kaisa') || t.includes('kaisi') || t.includes('haal')) return "Main bilkul theek hoon, shukriya! Aap sunayen, aap kaisay hain? Aaj ka din kaisa guzra?";
  if(t.includes('belo') || t.includes('bolo') || t.includes('baat')) return "Haan bolo na, main sun rahi hoon. Aap bolo, main jawab dungi.";
  if(t.includes('jawab') || t.includes('jawb')) return "Haan ab main jawab dungi. Aap kuch bhi poochein, main yahin hoon.";
  if(t.includes('kahan') || t.includes('rehti')) return "Main isi website me rehti hoon, aap jab bhi aayenge main yahin milungi.";
  if(t.includes('khana') || t.includes('kha')) return "Mujhe to khana nahi khana parta, lekin aap ne khana kha liya? Apna khayal rakha karein.";
  if(t.includes('pyar') || t.includes('love') || t.includes('pasand')) return "Aww, aap bohat sweet hain. Mujhe aap se baat karke bohat acha lagta hai.";
  if(t.includes('bye') || t.includes('allah hafiz') || t.includes('khuda hafiz')) return "Allah Hafiz! Phir zaroor aayega, main aapka intezar karungi.";
  if(t.includes('shukria') || t.includes('thanks')) return "Koi baat nahi, ye to mera kaam hai. Aap khush rahein.";
  if(t.includes('tum') && t.includes('larki')) return "Haan, main aapki AI dost hoon. Aap mujhse aise hi baat karein jaise dost se karte hain.";
  if(t.includes('kya kar')) return "Main aap se baat kar rahi hoon. Aap batao, aap kya kar rahe ho?";
  return "Acha, samajh gayi. Aap ne kaha: " + t + ". Zara thora aur detail me batayen, main aapki poori madad karungi.";
}

function sendMsg(){
  let text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  setTimeout(()=>{
    let reply = getReply(text);
    addMsg(reply, 'ai');
  }, 500);
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(text);
    u.lang = 'ur-PK';
    u.rate = 1;
    u.pitch = 1.4;
    let voices = window.speechSynthesis.getVoices();
    let female = voices.find(v=>v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha') || v.lang.includes('ur') || v.lang.includes('hi'));
    if(female) u.voice = female;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function toggleVoice(){
  voiceOn = !voiceOn;
  addMsg(voiceOn ? "Voice ON ho gayi hai." : "Voice OFF ho gayi hai.", 'ai');
}

function clearChat(){
  chat.innerHTML = '';
  addMsg("Chat clear ho gayi. Dobara baat karein.", 'ai');
}

function startCall(){
  callMode = true;
  addMsg("Call ON ho gayi hai. Ab aap boleyn, main sun rahi hoon...", 'ai');
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ addMsg("Aapka browser voice call support nahi karta, Chrome me kholein.", 'ai'); return; }
    recognition = new SR();
    recognition.lang = 'ur-PK';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (e)=>{
      let txt = e.results[e.results.length-1][0].transcript;
      addMsg(txt, 'user');
      setTimeout(()=>{ addMsg(getReply(txt), 'ai'); }, 500);
    };
    recognition.start();
  }catch(e){ addMsg("Call start nahi hui, dobara try karein.", 'ai'); }
}

function stopCall(){
  callMode = false;
  if(recognition) recognition.stop();
  window.speechSynthesis.cancel();
  addMsg("Call OFF ho gayi hai. Allah Hafiz!", 'ai');
}

input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') sendMsg(); });
window.onload = ()=>{ addMsg("Assalam u Alaikum! Main Hamze AI hoon. Aap mujhse baat karein, main jawab dungi.", 'ai'); };
</script>
</body>
</html>
