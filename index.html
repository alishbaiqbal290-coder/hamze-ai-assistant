
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza AI Assistant</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d0b;
  color:white;
}

header {
  padding:20px;
  text-align:center;
  background:#101a15;
  border-bottom:1px solid #174d32;
}

.logo {
  color:#32e987;
  font-size:25px;
  font-weight:bold;
}

header p {
  color:#9aa9a0;
  font-size:12px;
}

#status {
  color:#32e987;
  font-size:13px;
  margin-top:8px;
}

#chat {
  height:calc(100dvh - 220px);
  overflow-y:auto;
  padding:15px;
}

.message {
  padding:13px;
  margin:12px 0;
  border-radius:14px;
  max-width:88%;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  background:#155b39;
  margin-left:auto;
}

.ai {
  background:#18231d;
  border:1px solid #284635;
  margin-right:auto;
}

.controls {
  background:#101a15;
  padding:12px;
  position:sticky;
  bottom:0;
  border-top:1px solid #244331;
}

.inputrow {
  display:flex;
  gap:8px;
}

input {
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:12px;
  border:1px solid #31523e;
  background:#080d0b;
  color:white;
  font-size:15px;
}

button {
  border:none;
  border-radius:12px;
  padding:12px 15px;
  background:#20c875;
  color:#06150d;
  font-weight:bold;
  cursor:pointer;
}

.actions {
  display:flex;
  gap:9px;
  margin-top:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.actions button {
  background:#1b3024;
  color:white;
  border:1px solid #315a40;
}

.actions button.active {
  background:#20c875;
  color:#06150d;
}

button:disabled {
  opacity:.5;
}

.welcome {
  text-align:center;
  margin-top:45px;
  color:#a8b9ad;
}

</style>
</head>

<body>

<header>
  <div class="logo">✦ HAMZA AI</div>
  <p>YOUR PERSONAL AI ASSISTANT</p>
  <div id="status">● Ready to chat</div>
</header>

<main id="chat">
  <div class="welcome">
    <h2>Assalam-o-Alaikum!</h2>
    <h3>I'm Hamza AI Assistant</h3>
    <p>Ask me anything. Let's talk!</p>
  </div>
</main>

<div class="controls">

  <div class="inputrow">
    <input
      id="userInput"
      placeholder="Type your message here..."
      autocomplete="off"
    >
    <button id="sendBtn" onclick="sendMessage()">SEND</button>
  </div>

  <div class="actions">
    <button id="callBtn" onclick="toggleCall()">
      📞 CALL ON
    </button>

    <button onclick="stopVoice()">
      📵 CALL OFF
    </button>

    <button onclick="toggleSpeech()">
      🔊 Voice ON/OFF
    </button>

    <button onclick="clearChat()">
      🗑 Clear Chat
    </button>
  </div>

</div>

<script>

// AI SETTINGS
const API_URL = "/api/chat";

// CHAT SETTINGS
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const statusText = document.getElementById("status");

let callActive = false;
let speechEnabled = true;
let recognition = null;
let speaking = false;

const saved = JSON.parse(
  localStorage.getItem("hamza_chat") || "[]"
);

saved.forEach(item => {
  addMessage(item.text,item.type,false);
});

function addMessage(text,type,save=true) {

  const welcome = document.querySelector(".welcome");
  if(welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if(save) {
    saved.push({text,type});
    localStorage.setItem(
      "hamza_chat",
      JSON.stringify(saved)
    );
  }
}

async function sendMessage(text=null) {

  const message = (text || input.value).trim();

  if(!message) return;

  input.value = "";

  addMessage(message,"user");

  statusText.textContent = "● Thinking...";

  document.getElementById("sendBtn").disabled = true;

  try {

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:message,
        history:saved.slice(-20).map(m=>({
          role:m.type === "user" ? "user" : "assistant",
          content:m.text
        }))
      })
    });

    if(!response.ok) {
      throw new Error("AI server error: " + response.status);
    }

    const data = await response.json();

    const answer = data.reply || data.answer;

    if(!answer) {
      throw new Error("AI response was empty");
    }

    addMessage(answer,"ai");

    statusText.textContent = "● Ready to chat";

    if(speechEnabled) {
      speak(answer);
    }

  } catch(error) {

    addMessage(
      "AI connection is not ready. Please check the AI server and internet connection.",
      "ai"
    );

    statusText.textContent = "● Connection error";

    console.error(error);

  } finally {

    document.getElementById("sendBtn").disabled = false;

  }
}

// ENTER TO SEND
input.addEventListener("keydown",e=>{
  if(e.key === "Enter") sendMessage();
});

// TEXT TO SPEECH
function speak(text) {

  if(!speechEnabled || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "ur-PK";
  utterance.rate = 1;

  speaking = true;

  utterance.onend = () => {
    speaking = false;
    if(callActive) startListening();
  };

  utterance.onerror = () => {
    speaking = false;
    if(callActive) startListening();
  };

  speechSynthesis.speak(utterance);
}

// VOICE RECOGNITION
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "ur-PK";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = event => {

    const transcript =
      event.results[0][0].transcript;

    statusText.textContent = "● You said: " + transcript;

    sendMessage(transcript);
  };

  recognition.onerror = event => {

    statusText.textContent =
      "● Microphone: " + event.error;

    if(callActive && event.error !== "not-allowed") {
      setTimeout(startListening,1000);
    }
  };

  recognition.onend = () => {

    if(callActive && !speaking) {
      setTimeout(startListening,700);
    }

  };

}

// START LISTENING
function startListening() {

  if(!recognition || !callActive || speaking) return;

  try {
    recognition.start();
    statusText.textContent = "● Listening...";
  } catch(error) {
    console.log(error);
  }

}

// CALL ON/OFF
function toggleCall() {

  if(!recognition) {
    statusText.textContent =
      "● Voice recognition is not supported in this browser";
    return;
  }

  callActive = !callActive;

  document.getElementById("callBtn")
    .classList.toggle("active",callActive);

  if(callActive) {

    statusText.textContent = "● Voice call active";
    startListening();

  } else {

    stopVoice();

  }

}

function stopVoice() {

  callActive = false;

  if(recognition) recognition.stop();

  if("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  speaking = false;

  document.getElementById("callBtn")
    .classList.remove("active");

  statusText.textContent = "● Call disconnected";

}

function toggleSpeech() {

  speechEnabled = !speechEnabled;

  if(!speechEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  statusText.textContent =
    speechEnabled ? "● Voice enabled" : "● Voice disabled";

}

function clearChat() {

  if(!confirm("Delete all chat history?")) return;

  saved.length = 0;

  localStorage.removeItem("hamza_chat");

  chat.innerHTML = `
    <div class="welcome">
      <h2>Welcome to Hamza AI!</h2>
      <p>Start a new conversation.</p>
    </div>
  `;

}

</script>

</body>
</html>
